apiVersion: v1
kind: Namespace
metadata:
  name: np-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: np-demo
  labels: {app: server}
spec:
  containers:
    - name: nginx
      image: nginx:1.30.7-alpine
      imagePullPolicy: IfNotPresent
      ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: np-demo
spec:
  selector: {app: server}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: np-demo
  labels: {app: client}
spec:
  containers:
    - name: curl
      image: nginx:1.30.7-alpine
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
